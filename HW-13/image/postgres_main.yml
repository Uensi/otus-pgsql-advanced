---
# Установка postgreSQL 16

- name: Add PostgreSQL apt key
  ansible.builtin.get_url:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    dest: /etc/apt/keyrings/postgresql.asc
    mode: "0644"

- name: Add PostgreSQL repo
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/postgresql.asc] http://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main"
    state: present
    filename: pgdg

- name: Install PostgreSQL {{ pg_version }}
  ansible.builtin.apt:
    name:
      - "postgresql-{{ pg_version }}"
      - "postgresql-contrib-{{ pg_version }}"
    state: present

- name: Ensure PostgreSQL is running
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Create benchdb database (идемпотентно)
  ansible.builtin.shell: |
    sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='{{ db_name }}'" | grep -q 1 \
      || sudo -u postgres psql -c "CREATE DATABASE {{ db_name }};"
  changed_when: true

- name: Create {{ table_name }} table if not exists
  ansible.builtin.shell: |
    sudo -u postgres psql -d {{ db_name }} -c "
      CREATE TABLE IF NOT EXISTS {{ table_name }} (
        taxi_id INT,
        trip_start_timestamp TIMESTAMP,
        trip_end_timestamp TIMESTAMP,
        trip_seconds INT,
        trip_miles NUMERIC,
        fare NUMERIC,
        tips NUMERIC,
        tolls NUMERIC,
        extras NUMERIC,
        trip_total NUMERIC,
        payment_type TEXT,
        company TEXT,
        pickup_community_area INT,
        dropoff_community_area INT
      );"
  changed_when: true
